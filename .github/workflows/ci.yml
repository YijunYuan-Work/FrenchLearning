name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint, tests, and build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run critical-flow tests
        id: e2e
        run: npm run test:e2e

      - name: Summarize browser tests
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: node scripts/playwright-summary.js

      - name: Upload browser report and diagnostics
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/junit.xml
          if-no-files-found: ignore
          retention-days: 7
