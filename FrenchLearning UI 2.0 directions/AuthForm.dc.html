<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.460.0/font/lucide.css">
<style>
@keyframes fl-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fl-err{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes fl-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fl-spin{to{transform:rotate(360deg)}}
.af-in::placeholder{color:#958B7A;font-style:italic}
.af-in:focus{outline:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</helmet>
<div style="container-type:inline-size;display:flex;flex-direction:column;gap:28px;width:100%;font-family:'Instrument Sans','Noto Sans SC',system-ui,sans-serif;color:#2A241C">
  <div role="tablist" aria-label="{{ t.modeAria }}" onKeyDown="{{ onTabKey }}" style="position:relative;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #DDD3C3">
    <button ref="{{ tabInRef }}" type="button" role="tab" id="{{ tabInId }}" aria-selected="{{ inSel }}" aria-controls="{{ panelId }}" tabIndex="{{ inTab }}" onClick="{{ toIn }}" disabled="{{ busy }}" style="height:52px;border:0;background:transparent;cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:8px;padding:16px 4px 0;color:{{ inFg }};font-size:15px;font-weight:{{ inW }};font-family:inherit;transition:color 160ms" style-hover="color:#2A241C"><span style="font:italic 400 17px/1 'Newsreader',serif;color:{{ inNum }}">I.</span><span>{{ t.tabIn }}</span></button>
    <button ref="{{ tabUpRef }}" type="button" role="tab" id="{{ tabUpId }}" aria-selected="{{ upSel }}" aria-controls="{{ panelId }}" tabIndex="{{ upTab }}" onClick="{{ toUp }}" disabled="{{ busy }}" style="height:52px;border:0;background:transparent;cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:8px;padding:16px 4px 0;color:{{ upFg }};font-size:15px;font-weight:{{ upW }};font-family:inherit;transition:color 160ms" style-hover="color:#2A241C"><span style="font:italic 400 17px/1 'Newsreader',serif;color:{{ upNum }}">II.</span><span>{{ t.tabUp }}</span></button>
    <span aria-hidden="true" style="position:absolute;bottom:-1px;left:0;width:50%;height:2px;background:#2A241C;transform:translateX({{ indX }});transition:transform 280ms cubic-bezier(.2,.7,.2,1)"></span>
  </div>

  <form id="{{ panelId }}" role="tabpanel" aria-labelledby="{{ activeTabId }}" onSubmit="{{ onSubmit }}" noValidate="{{ true }}" aria-busy="{{ busyStr }}" style="display:flex;flex-direction:column;gap:28px;margin:0">
    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-if value="{{ isIn }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:10px;animation:fl-rise 320ms cubic-bezier(.2,.7,.2,1) both"><span lang="fr" style="font:italic 400 19px/1 'Newsreader',serif;color:#8A5F32">— bon retour</span><h1 style="margin:0;font:400 clamp(28px,9.5cqi,40px)/1.1 'Newsreader','Noto Serif SC',serif;letter-spacing:-.01em;text-wrap:balance">{{ t.titleIn }}</h1></div></sc-if>
      <sc-if value="{{ isUp }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:10px;animation:fl-rise 320ms cubic-bezier(.2,.7,.2,1) both"><span lang="fr" style="font:italic 400 19px/1 'Newsreader',serif;color:#8A5F32">— bienvenue</span><h1 style="margin:0;font:400 clamp(28px,9.5cqi,40px)/1.1 'Newsreader','Noto Serif SC',serif;letter-spacing:-.01em;text-wrap:balance">{{ t.titleUp }}</h1></div></sc-if>
      <sc-if value="{{ showCopy }}" hint-placeholder-val="{{ true }}"><p style="margin:0;font-size:15px;line-height:1.55;color:#4E4639;text-wrap:pretty">{{ t.copy }}</p></sc-if>
    </div>

    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="{{ u.id }}" style="font-size:14px;font-weight:600;color:{{ u.labelFg }};transition:color 160ms">{{ t.username }}</label>
        <div style="position:relative">
          <input class="af-in" ref="{{ uRef }}" id="{{ u.id }}" name="username" autoComplete="username" autoCapitalize="none" autoCorrect="off" spellCheck="false" required="{{ true }}" value="{{ user }}" readOnly="{{ ro }}" onChange="{{ onUser }}" onFocus="{{ fUser }}" onBlur="{{ onBlur }}" aria-invalid="{{ u.inv }}" aria-describedby="{{ u.desc }}" style="display:block;width:100%;box-sizing:border-box;height:48px;border:0;border-radius:6px;background:#F8F5EF;box-shadow:inset 0 0 0 1px {{ u.line }};padding:0 14px;font-size:16px;font-family:inherit;color:#2A241C;transition:box-shadow 160ms">
          <span aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:0 0 6px 6px;background:{{ u.bar }};transform:scaleX({{ u.scale }});transform-origin:left;transition:transform 240ms cubic-bezier(.2,.7,.2,1)"></span>
        </div>
        <sc-if value="{{ u.err }}" hint-placeholder-val="{{ false }}"><span id="{{ u.errId }}" style="display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.4;color:#A0402F;animation:fl-err 220ms cubic-bezier(.2,.7,.2,1) both"><i class="icon-circle-alert" aria-hidden="true" style="font-size:14px;margin-top:1px;flex-shrink:0"></i><span style="flex:1;min-width:0">{{ u.msg }}</span></span></sc-if>
        <sc-if value="{{ u.hint }}" hint-placeholder-val="{{ false }}"><span id="{{ u.hintId }}" style="font-size:13px;line-height:1.4;color:#6F6656">{{ t.userHint }}</span></sc-if>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label for="{{ p.id }}" style="font-size:14px;font-weight:600;color:{{ p.labelFg }};transition:color 160ms">{{ t.password }}</label>
        <div style="position:relative">
          <input class="af-in" ref="{{ pRef }}" id="{{ p.id }}" name="password" type="{{ pwType }}" autoComplete="{{ pwAc }}" required="{{ true }}" minLength="{{ pwMin }}" value="{{ pass }}" readOnly="{{ ro }}" onChange="{{ onPass }}" onFocus="{{ fPass }}" onBlur="{{ onBlur }}" aria-invalid="{{ p.inv }}" aria-describedby="{{ p.desc }}" style="display:block;width:100%;box-sizing:border-box;height:48px;border:0;border-radius:6px;background:#F8F5EF;box-shadow:inset 0 0 0 1px {{ p.line }};padding:0 92px 0 14px;font-size:16px;font-family:inherit;color:#2A241C;letter-spacing:{{ pwLs }};transition:box-shadow 160ms">
          <span aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:0 0 6px 6px;background:{{ p.bar }};transform:scaleX({{ p.scale }});transform-origin:left;transition:transform 240ms cubic-bezier(.2,.7,.2,1)"></span>
          <button type="button" onClick="{{ onTogglePw }}" aria-pressed="{{ pwPressed }}" aria-controls="{{ p.id }}" aria-label="{{ pwAria }}" style="position:absolute;top:4px;right:4px;height:40px;min-width:44px;padding:0 12px;border:0;border-radius:4px;background:transparent;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;font-family:inherit;color:#3F6670;cursor:pointer;transition:background 160ms" style-hover="background:#E8E1D4"><i class="{{ pwIcon }}" aria-hidden="true" style="font-size:16px"></i><span>{{ pwLabel }}</span></button>
        </div>
        <sc-if value="{{ p.err }}" hint-placeholder-val="{{ false }}"><span id="{{ p.errId }}" style="display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.4;color:#A0402F;animation:fl-err 220ms cubic-bezier(.2,.7,.2,1) both"><i class="icon-circle-alert" aria-hidden="true" style="font-size:14px;margin-top:1px;flex-shrink:0"></i><span style="flex:1;min-width:0">{{ p.msg }}</span></span></sc-if>
        <sc-if value="{{ p.hint }}" hint-placeholder-val="{{ false }}"><span id="{{ p.hintId }}" style="display:flex;gap:6px;align-items:center;font-size:13px;line-height:1.4;color:{{ p.hintFg }};transition:color 200ms"><i class="{{ p.hintIcon }}" aria-hidden="true" style="font-size:14px"></i><span>{{ t.pwHint }}</span></span></sc-if>
      </div>

      <div aria-hidden="{{ emHidden }}" style="display:grid;grid-template-rows:{{ emRows }};margin-top:{{ emMt }};opacity:{{ emOp }};transition:grid-template-rows 280ms cubic-bezier(.2,.7,.2,1),margin-top 280ms cubic-bezier(.2,.7,.2,1),opacity 200ms">
        <div style="overflow:hidden;min-height:0">
          <div style="display:flex;flex-direction:column;gap:6px;padding:2px 0">
            <label for="{{ e.id }}" style="font-size:14px;font-weight:600;color:{{ e.labelFg }};transition:color 160ms">{{ t.email }} <span style="font-weight:400;color:#6F6656">· {{ t.optional }}</span></label>
            <div style="position:relative">
              <input class="af-in" ref="{{ eRef }}" id="{{ e.id }}" name="email" type="email" inputMode="email" autoComplete="email" autoCapitalize="none" spellCheck="false" placeholder="john@example.com" value="{{ email }}" readOnly="{{ ro }}" disabled="{{ emOff }}" onChange="{{ onEmail }}" onFocus="{{ fEmail }}" onBlur="{{ onBlur }}" aria-invalid="{{ e.inv }}" aria-describedby="{{ e.desc }}" style="display:block;width:100%;box-sizing:border-box;height:48px;border:0;border-radius:6px;background:#F8F5EF;box-shadow:inset 0 0 0 1px {{ e.line }};padding:0 44px 0 14px;font-size:16px;font-family:inherit;color:#2A241C;transition:box-shadow 160ms">
              <span aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:0 0 6px 6px;background:{{ e.bar }};transform:scaleX({{ e.scale }});transform-origin:left;transition:transform 240ms cubic-bezier(.2,.7,.2,1)"></span>
              <sc-if value="{{ emOk }}" hint-placeholder-val="{{ false }}"><i class="icon-check" aria-hidden="true" style="position:absolute;right:14px;top:16px;font-size:16px;color:#55703F;animation:fl-pop 200ms cubic-bezier(.2,.7,.2,1) both"></i></sc-if>
            </div>
            <sc-if value="{{ e.err }}" hint-placeholder-val="{{ false }}"><span id="{{ e.errId }}" style="display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.4;color:#A0402F;animation:fl-err 220ms cubic-bezier(.2,.7,.2,1) both"><i class="icon-circle-alert" aria-hidden="true" style="font-size:14px;margin-top:1px;flex-shrink:0"></i><span style="flex:1;min-width:0">{{ e.msg }}</span></span></sc-if>
            <sc-if value="{{ e.hint }}" hint-placeholder-val="{{ true }}"><span id="{{ e.hintId }}" style="font-size:13px;line-height:1.4;color:#6F6656">{{ t.emailHint }}</span></sc-if>
          </div>
        </div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <sc-if value="{{ hasFormErr }}" hint-placeholder-val="{{ false }}"><div role="alert" style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:6px;background:#F6ECE2;animation:fl-err 220ms cubic-bezier(.2,.7,.2,1) both"><i class="{{ feIcon }}" aria-hidden="true" style="font-size:17px;color:#A0402F;margin-top:1px"></i><div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0"><span style="font-size:14px;font-weight:600;line-height:1.4;color:#A0402F">{{ feTitle }}</span><span style="font-size:13px;line-height:1.45;color:#4E4639">{{ feSub }}</span></div></div></sc-if>
      <button type="submit" disabled="{{ btnDis }}" style="height:52px;width:100%;border:0;border-radius:6px;background:{{ btnBg }};color:{{ btnFg }};font-size:15px;font-weight:600;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;cursor:{{ btnCur }};box-shadow:{{ btnRing }};transition:background 200ms,transform 160ms" style-hover="background:{{ btnHover }}" style-active="transform:scale(.98)">
        <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width:14px;height:14px;box-sizing:border-box;border-radius:50%;border:2px solid rgba(239,233,223,.35);border-top-color:#EFE9DF;animation:fl-spin 800ms linear infinite"></span></sc-if>
        <sc-if value="{{ success }}" hint-placeholder-val="{{ false }}"><i class="icon-check" aria-hidden="true" style="font-size:17px;animation:fl-pop 240ms cubic-bezier(.2,.7,.2,1) both"></i></sc-if>
        <span>{{ btnLabel }}</span>
      </button>
    </div>
    <span role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">{{ liveMsg }}</span>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:640},&quot;cfg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  static T = {
    en: { modeAria: 'Account', tabIn: 'Sign in', tabUp: 'Create account', titleIn: 'Sign in to your workspace.', titleUp: 'Create your workspace.', copy: 'Keep your vocabulary, grammar, pronunciation rules, quizzes, and study cards attached to your own account.', username: 'Username', userHint: 'Used to sign in. It can’t be changed later.', password: 'Password', pwHint: 'At least 6 characters', email: 'Recovery email', optional: 'optional', emailHint: 'Stored only so we can add password recovery later.', show: 'Show', hide: 'Hide', showAria: 'Show password', hideAria: 'Hide password', submitIn: 'Sign in', submitUp: 'Create account', loadingIn: 'Signing in…', loadingUp: 'Creating account…', successIn: 'Signed in', successUp: 'Account created', retry: 'Try again',
      userRequired: 'Enter your username.', userTaken: 'That username is already taken. Try another.', passRequired: 'Enter your password.', passShort: 'Use at least 6 characters.', emailInvalid: 'Enter a valid email, or leave it blank.', invalid: 'The username or password is incorrect.', invalidSub: 'Check both fields and try again.', network: 'Couldn’t reach French Desk.', networkSub: 'Check your connection, then try again. What you typed is still here.', fixFields: 'Please fix the highlighted fields.' },
    zh: { modeAria: '账号', tabIn: '登录', tabUp: '创建账号', titleIn: '登录你的工作区。', titleUp: '创建你的工作区。', copy: '把你的词汇、语法、发音规则、测验和学习卡片都保存在自己的账号下。', username: '用户名', userHint: '用于登录，之后无法更改。', password: '密码', pwHint: '至少 6 个字符', email: '找回邮箱', optional: '可选', emailHint: '仅用于之后添加密码找回功能。', show: '显示', hide: '隐藏', showAria: '显示密码', hideAria: '隐藏密码', submitIn: '登录', submitUp: '创建账号', loadingIn: '正在登录…', loadingUp: '正在创建账号…', successIn: '已登录', successUp: '账号已创建', retry: '重试',
      userRequired: '请输入用户名。', userTaken: '该用户名已被使用，请换一个。', passRequired: '请输入密码。', passShort: '密码至少需要 6 个字符。', emailInvalid: '请输入有效的邮箱，或留空。', invalid: '用户名或密码不正确。', invalidSub: '请检查两个字段后重试。', network: '无法连接到 French Desk。', networkSub: '请检查网络后重试，已输入的内容仍然保留。', fixFields: '请修正标出的字段。' },
  };
  uid = 'af' + Math.random().toString(36).slice(2, 7);
  uRef = React.createRef(); pRef = React.createRef(); eRef = React.createRef();
  tabInRef = React.createRef(); tabUpRef = React.createRef();
  cfg(p) { return (p && p.cfg) || p || {}; }
  componentDidUpdate(prev) {
    const a = this.cfg(prev), b = this.cfg(this.props);
    if (b.focusReq && b.focusReq !== a.focusReq) {
      const r = { user: this.uRef, pass: this.pRef, email: this.eRef }[b.focusField];
      if (r && r.current) r.current.focus();
    }
  }
  renderVals() {
    const c = this.cfg(this.props);
    const lang = c.lang === 'zh' ? 'zh' : 'en';
    const t = Component.T[lang];
    const up = c.mode === 'up';
    const st = c.status || 'idle';
    const loading = st === 'loading', success = st === 'success';
    const busy = loading || success;
    const live = typeof c.onField === 'function';
    const id = this.uid;
    const msgs = { required: null, taken: t.userTaken, short: t.passShort, invalid: t.emailInvalid };
    const mk = (k, code, reqMsg, hint) => {
      const f = c.focus === k, err = !!code;
      const errId = `${id}-${k}-err`, hintId = `${id}-${k}-hint`;
      return { id: `${id}-${k}`, err, msg: code === 'required' ? reqMsg : msgs[code], errId, hint: !err && hint, hintId,
        line: err ? '#A0402F' : f ? '#3F6670' : '#CDBFA9', bar: err ? '#A0402F' : '#3F6670', scale: f ? 1 : 0,
        labelFg: err ? '#A0402F' : f ? '#3F6670' : '#2A241C', inv: err ? 'true' : 'false',
        desc: err ? errId : hint ? hintId : undefined };
    };
    const pass = c.pass || '', email = c.email || '';
    const pwOk = pass.length >= 6;
    const emValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const p = mk('pass', c.errPass, t.passRequired, up);
    p.hintFg = pwOk ? '#55703F' : '#6F6656'; p.hintIcon = pwOk ? 'icon-check' : 'icon-minus';
    const fe = c.formError;
    const setMode = (m) => { if (!busy && c.onMode) c.onMode(m); };
    const disabled = st === 'disabled';
    return {
      t, user: c.user || '', pass, email, ro: !live || busy, showCopy: c.showCopy !== false,
      isIn: !up, isUp: up, busy, busyStr: busy ? 'true' : 'false', loading, success,
      tabInId: `${id}-tin`, tabUpId: `${id}-tup`, panelId: `${id}-panel`, activeTabId: up ? `${id}-tup` : `${id}-tin`,
      tabInRef: this.tabInRef, tabUpRef: this.tabUpRef,
      inSel: up ? 'false' : 'true', upSel: up ? 'true' : 'false', inTab: up ? -1 : 0, upTab: up ? 0 : -1,
      inFg: up ? '#6F6656' : '#2A241C', upFg: up ? '#2A241C' : '#6F6656', inW: up ? 500 : 600, upW: up ? 600 : 500,
      inNum: up ? '#958B7A' : '#3F6670', upNum: up ? '#3F6670' : '#958B7A', indX: up ? '100%' : '0%',
      toIn: () => setMode('in'), toUp: () => setMode('up'),
      onTabKey: (e) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
        e.preventDefault();
        const next = e.key === 'Home' ? 'in' : e.key === 'End' ? 'up' : up ? 'in' : 'up';
        setMode(next);
        (next === 'up' ? this.tabUpRef : this.tabInRef).current?.focus();
      },
      u: mk('user', c.errUser, t.userRequired, up), p, e: mk('email', up ? c.errEmail : null, '', true),
      uRef: this.uRef, pRef: this.pRef, eRef: this.eRef,
      onUser: (ev) => live && c.onField('user', ev.target.value),
      onPass: (ev) => live && c.onField('pass', ev.target.value),
      onEmail: (ev) => live && c.onField('email', ev.target.value),
      fUser: () => c.onFocusField && c.onFocusField('user'), fPass: () => c.onFocusField && c.onFocusField('pass'), fEmail: () => c.onFocusField && c.onFocusField('email'),
      onBlur: () => c.onFocusField && c.onFocusField(''),
      pwType: c.showPw ? 'text' : 'password', pwAc: up ? 'new-password' : 'current-password', pwMin: up ? 6 : undefined,
      pwLs: c.showPw || !pass ? 'normal' : '.12em',
      pwPressed: c.showPw ? 'true' : 'false', pwAria: c.showPw ? t.hideAria : t.showAria, pwLabel: c.showPw ? t.hide : t.show, pwIcon: c.showPw ? 'icon-eye-off' : 'icon-eye',
      onTogglePw: () => c.onTogglePw && c.onTogglePw(),
      emHidden: up ? 'false' : 'true', emRows: up ? '1fr' : '0fr', emMt: up ? '0px' : '-20px', emOp: up ? 1 : 0, emOff: !up,
      emOk: up && emValid && !c.errEmail,
      hasFormErr: !!fe, feTitle: fe === 'network' ? t.network : t.invalid, feSub: fe === 'network' ? t.networkSub : t.invalidSub,
      feIcon: fe === 'network' ? 'icon-wifi-off' : 'icon-circle-alert',
      onSubmit: (ev) => { ev.preventDefault(); if (!busy && c.onSubmit) c.onSubmit(); },
      btnDis: busy || disabled,
      btnBg: success ? '#55703F' : disabled ? '#DDD3C3' : c.hover ? '#3F6670' : '#2A241C',
      btnFg: disabled ? '#6F6656' : '#EFE9DF',
      btnHover: busy || disabled ? (success ? '#55703F' : disabled ? '#DDD3C3' : '#2A241C') : '#3F6670',
      btnCur: busy ? 'progress' : disabled ? 'not-allowed' : 'pointer',
      btnRing: c.ring ? '0 0 0 2px #FCFAF6, 0 0 0 4px #3F6670' : 'none',
      btnLabel: loading ? (up ? t.loadingUp : t.loadingIn) : success ? (up ? t.successUp : t.successIn) : fe === 'network' ? t.retry : up ? t.submitUp : t.submitIn,
      liveMsg: loading ? (up ? t.loadingUp : t.loadingIn) : success ? (up ? t.successUp : t.successIn) : c.errUser || c.errPass || c.errEmail ? t.fixFields : '',
    };
  }
}
</script>
</body>
</html>
